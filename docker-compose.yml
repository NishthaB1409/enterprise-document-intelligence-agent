# One command to a demoable stack: Qdrant plus the API.
#
# Langfuse is deliberately not here. Self-hosting it means Postgres, ClickHouse,
# Redis, and MinIO alongside this — more moving parts than the phase-1 demo
# needs. Point LANGFUSE_* at Langfuse Cloud (or your own instance) in .env and
# tracing works the same; leave them blank and the app runs untraced.

services:
  qdrant:
    # Pinned to match the locked qdrant-client (1.19.x). `latest` would make
    # the same commit start a different database next month — the opposite of
    # a reproducible run. Bump it together with qdrant-client in uv.lock.
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333" # REST + the web dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Optional so `docker compose up` works on a fresh clone before anyone has
      # copied .env.example. Without OPENAI_API_KEY, /ingest works and /query
      # returns 503 with a message saying so.
      - path: .env
        required: false
    environment:
      # Inside the Compose network Qdrant is a hostname, not localhost. Set here
      # rather than in .env so the same .env works for a locally-run app.
      QDRANT_URL: http://qdrant:6333
      # Blanked on purpose. A .env set up for running the app outside Docker
      # usually has QDRANT_PATH (embedded mode), and it takes precedence over
      # QDRANT_URL — so without this the container would quietly run its own
      # embedded database and ignore the Qdrant service beside it.
      QDRANT_PATH: ""
      # On a volume: a pending review lost to a container restart is a
      # requester told "a human will look at this" and then forgotten.
      REVIEW_DB_PATH: /srv/data/reviews.sqlite3
    volumes:
      - embedding-cache:/var/cache/fastembed
      - review-queue:/srv/data
    depends_on:
      # Ordering only — the API tolerates Qdrant being slow to come up (startup
      # logs a warning, and the first ingest creates the collection), so a
      # health-gated start would buy nothing.
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-storage:
  # Holds the embedding model weights, so a restart doesn't re-download ~130MB.
  embedding-cache:
  # The human-review queue (SQLite).
  review-queue:
