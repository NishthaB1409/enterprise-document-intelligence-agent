[project]
name = "edia"
version = "0.1.0"
description = "Enterprise Document-Intelligence Agent"
readme = "README.md"
requires-python = ">=3.12"

# The baseline RAG path: API surface, observability, ingestion, retrieval, and
# citation-grounded generation, plus the agentic graph. The answer-quality eval
# stack is the `eval` extra below.
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
    "langfuse>=3.10,<5",
    "pydantic-settings>=2.7.0",
    # llama-index-core alone, not the `llama-index` meta-package: the latter pulls
    # an OpenAI client and its default embedding/LLM stack, none of which this
    # service uses.
    "llama-index-core>=0.14.0",
    "llama-index-readers-file>=0.5.0",
    # `fastembed` extra: embeddings run locally, so ingestion needs no second API
    # key and the test suite makes no network calls.
    "qdrant-client[fastembed]>=1.19.0",
    "openai>=1.60.0",
    # The agentic graph: routing, document grading, query rewriting, and
    # self-critique as an explicit state machine rather than a call chain.
    "langgraph>=1.2.10",
]

[project.optional-dependencies]
# Answer-quality evaluation (`python -m eval.answer_eval`). Kept out of the
# default install: it pulls langchain and ~100 more packages the service never
# imports. Ragas alone rather than Ragas plus DeepEval — two libraries would
# judge the same answers with different prompts, and a report and a CI gate
# that can disagree about one answer are worse than either on its own.
eval = [
    "ragas>=0.4.3",
    # Ragas 0.4.3 imports `langchain_community.chat_models.vertexai` at import
    # time, and langchain-community 0.4 deleted it. Unpinned, `import ragas`
    # fails outright. Lift this once Ragas stops importing it.
    "langchain-community<0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "opentelemetry-proto>=1.30.0",
    "reportlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
