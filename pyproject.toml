[project]
name = "edia"
version = "0.1.0"
description = "Enterprise Document-Intelligence Agent"
readme = "README.md"
requires-python = ">=3.12"

# Commit 1 deps only: the API surface + observability. The retrieval/orchestration/
# eval stack (llama-index, langgraph, qdrant-client, ragas, deepeval) is added in the
# commit that introduces the code using it — see the extras below.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "langfuse>=3.10,<5",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
# Planned stack, wired up as each layer lands. Kept out of the default install so
# commit 1 stays fast to reproduce.
retrieval = ["llama-index>=0.14.23", "qdrant-client>=1.19.0"]
agent = ["langgraph>=1.2.10"]
eval = ["ragas>=0.4.3", "deepeval>=4.1.7"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "opentelemetry-proto>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
