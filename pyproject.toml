[project]
name = "edia"
version = "0.1.0"
description = "Enterprise Document-Intelligence Agent"
readme = "README.md"
requires-python = ">=3.12"

# The baseline RAG path: API surface, observability, ingestion, retrieval, and
# citation-grounded generation. The orchestration/eval stack (langgraph, ragas,
# deepeval) is still added in the commit that introduces the code using it.
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
    "langfuse>=3.10,<5",
    "pydantic-settings>=2.7.0",
    # llama-index-core alone, not the `llama-index` meta-package: the latter pulls
    # an OpenAI client and its default embedding/LLM stack, none of which this
    # service uses.
    "llama-index-core>=0.14.0",
    "llama-index-readers-file>=0.5.0",
    # `fastembed` extra: embeddings run locally, so ingestion needs no second API
    # key and the test suite makes no network calls.
    "qdrant-client[fastembed]>=1.19.0",
    "anthropic>=0.75.0",
]

[project.optional-dependencies]
# Planned stack, wired up as each layer lands. Kept out of the default install so
# a clean reproduce stays fast.
agent = ["langgraph>=1.2.10"]
eval = ["ragas>=0.4.3", "deepeval>=4.1.7"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "opentelemetry-proto>=1.30.0",
    "reportlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
