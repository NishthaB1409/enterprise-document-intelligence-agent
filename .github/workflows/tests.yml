# The offline test suite, on every push and pull request.
#
# Free and fast: the suite needs no API key, no Qdrant server, and no network
# beyond installing packages. tests/fakes.py stands in for the embedder, the
# vector store, and the model, so this runs the production pipeline end to end
# in about half a minute.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Pinned so the image changes when we choose, not when ubuntu-latest moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only exact tags (no @v10), so this pins a release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      # --frozen fails if uv.lock and pyproject.toml have drifted, which is the
      # point of committing a lockfile.
      - run: uv sync --frozen

      - run: uv run pytest -q
